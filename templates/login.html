<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PivotGuard | Secure Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(
                circle at top,
                #172554,
                #020617 55%
            );
            color: white;
        }

        .login-container {
            width: 420px;
            max-width: 92%;
            padding: 38px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            background: #2563eb;
            font-size: 34px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .secure {
            text-align: center;
            color: #22c55e;
            font-size: 13px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 13px;
        }

        .security-info {
            margin-top: 22px;
            padding: 14px;
            border-radius: 10px;
            background: rgba(2, 6, 23, 0.75);
            border: 1px solid #1e293b;
            text-align: center;
        }

        .security-info span {
            color: #64748b;
            font-size: 12px;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #64748b;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🛡️</div>

    <h1>PivotGuard</h1>

    <div class="subtitle">
        Pivoting & Lateral Movement Detection System
    </div>

    <div class="secure">
        ● Secure Authentication Portal
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
            autocomplete="username"
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
        >

        <button type="submit">
            Sign In
        </button>

    </form>

    <div class="security-info">
        <span>
            🔒 Authorized access only
        </span>
    </div>

    <div class="footer">
        PivotGuard Security Monitoring Platform
    </div>

</div>

</body>
</html>
